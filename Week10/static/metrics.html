<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books API Metrics Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header .subtitle {
            font-size: 1rem;
            opacity: 0.9;
        }

        .status-bar {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 15px 25px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .last-update {
            color: #6b7280;
            font-size: 0.9rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.15);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .card-icon {
            font-size: 1.5rem;
        }

        .card-title {
            font-size: 0.875rem;
            color: #6b7280;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .card-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 10px;
        }

        .card-subtitle {
            color: #6b7280;
            font-size: 0.9rem;
        }

        .metric-positive {
            color: #10b981;
        }

        .metric-negative {
            color: #ef4444;
        }

        .metric-warning {
            color: #f59e0b;
        }

        .chart-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .chart-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #1f2937;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #f9fafb;
            font-weight: 600;
            color: #374151;
            font-size: 0.875rem;
            text-transform: uppercase;
        }

        td {
            color: #6b7280;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-success {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-error {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-warning {
            background: #fef3c7;
            color: #92400e;
        }

        .progress-bar {
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card, .chart-section {
            animation: fadeIn 0.5s ease;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            margin: 50px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Books API Metrics Dashboard</h1>
            <p class="subtitle">Real-time monitoring and statistics</p>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <div class="status-dot"></div>
                <span><strong>Status:</strong> Online</span>
            </div>
            <div class="status-item">
                <span class="last-update">Last update: <span id="lastUpdate">-</span></span>
            </div>
            <div class="status-item">
                <span><strong>Auto-refresh:</strong> 2s</span>
            </div>
        </div>

        <div id="content" class="loading">Loading metrics...</div>
    </div>

    <script>
        let metricsData = null;

        function formatUptime(seconds) {
            const days = Math.floor(seconds / 86400);
            const hours = Math.floor((seconds % 86400) / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);
            
            let result = [];
            if (days > 0) result.push(`${days}d`);
            if (hours > 0) result.push(`${hours}h`);
            if (minutes > 0) result.push(`${minutes}m`);
            result.push(`${secs}s`);
            
            return result.join(' ');
        }

        function formatNumber(num) {
            return new Intl.NumberFormat().format(num);
        }

        function getStatusBadge(status) {
            if (status >= 200 && status < 300) return 'badge-success';
            if (status >= 400 && status < 500) return 'badge-warning';
            if (status >= 500) return 'badge-error';
            return 'badge-success';
        }

        function renderMetrics(data) {
            const content = document.getElementById('content');
            
            const html = `
                <!-- Key Metrics Grid -->
                <div class="grid">
                    <div class="card">
                        <div class="card-header">
                            <span class="card-icon">⏱️</span>
                            <span class="card-title">Uptime</span>
                        </div>
                        <div class="card-value">${formatUptime(data.server.uptime_seconds)}</div>
                        <div class="card-subtitle">Started: ${new Date(data.server.start_time).toLocaleString()}</div>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <span class="card-icon">📊</span>
                            <span class="card-title">Total Requests</span>
                        </div>
                        <div class="card-value">${formatNumber(data.requests.total)}</div>
                        <div class="card-subtitle">All time requests</div>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <span class="card-icon">⚡</span>
                            <span class="card-title">Avg Response Time</span>
                        </div>
                        <div class="card-value ${data.performance.avg_response_time_ms < 100 ? 'metric-positive' : 'metric-warning'}">${data.performance.avg_response_time_ms}ms</div>
                        <div class="card-subtitle">Min: ${data.performance.min_response_time_ms}ms | Max: ${data.performance.max_response_time_ms}ms</div>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <span class="card-icon">❌</span>
                            <span class="card-title">Error Rate</span>
                        </div>
                        <div class="card-value ${data.errors.error_rate_percent < 5 ? 'metric-positive' : 'metric-negative'}">${data.errors.error_rate_percent}%</div>
                        <div class="card-subtitle">${formatNumber(data.errors.total_errors)} total errors</div>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <span class="card-icon">📚</span>
                            <span class="card-title">Total Books</span>
                        </div>
                        <div class="card-value">${formatNumber(data.storage.total_books)}</div>
                        <div class="card-subtitle">${formatNumber(data.storage.books_available)} available</div>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <span class="card-icon">📖</span>
                            <span class="card-title">Book Copies</span>
                        </div>
                        <div class="card-value">${formatNumber(data.storage.total_copies)}</div>
                        <div class="card-subtitle">${formatNumber(data.storage.available_copies)} available</div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${(data.storage.available_copies / data.storage.total_copies * 100)}%"></div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <span class="card-icon">🚫</span>
                            <span class="card-title">Rate Limit Violations</span>
                        </div>
                        <div class="card-value ${data.errors.rate_limit_violations === 0 ? 'metric-positive' : 'metric-negative'}">${formatNumber(data.errors.rate_limit_violations)}</div>
                        <div class="card-subtitle">${data.rate_limiting.limit}</div>
                    </div>
                </div>

                <!-- Top Endpoints -->
                <div class="chart-section">
                    <h3 class="chart-title">🔥 Top Endpoints</h3>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Endpoint</th>
                                    <th>Requests</th>
                                    <th>Percentage</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.requests.top_endpoints.map(endpoint => `
                                    <tr>
                                        <td><code>${endpoint.endpoint}</code></td>
                                        <td><strong>${formatNumber(endpoint.count)}</strong></td>
                                        <td>
                                            ${((endpoint.count / data.requests.total) * 100).toFixed(1)}%
                                            <div class="progress-bar">
                                                <div class="progress-fill" style="width: ${(endpoint.count / data.requests.total) * 100}%"></div>
                                            </div>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Request Methods & Status Codes -->
                <div class="grid">
                    <div class="chart-section">
                        <h3 class="chart-title">📡 Requests by Method</h3>
                        <div class="table-container">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Method</th>
                                        <th>Count</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${Object.entries(data.requests.by_method).map(([method, count]) => `
                                        <tr>
                                            <td><span class="badge badge-success">${method}</span></td>
                                            <td><strong>${formatNumber(count)}</strong></td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="chart-section">
                        <h3 class="chart-title">📈 Status Codes</h3>
                        <div class="table-container">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Status</th>
                                        <th>Count</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${Object.entries(data.requests.by_status).map(([status, count]) => `
                                        <tr>
                                            <td><span class="badge ${getStatusBadge(parseInt(status))}">${status}</span></td>
                                            <td><strong>${formatNumber(count)}</strong></td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
            
            content.innerHTML = html;
            content.className = '';
            
            // Update last update time
            document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
        }

        async function fetchMetrics() {
            try {
                const response = await fetch('/metrics');
                const data = await response.json();
                metricsData = data;
                renderMetrics(data);
            } catch (error) {
                console.error('Error fetching metrics:', error);
                document.getElementById('content').innerHTML = `
                    <div class="chart-section">
                        <p style="color: #ef4444; text-align: center;">
                            ❌ Failed to load metrics. Retrying...
                        </p>
                    </div>
                `;
            }
        }

        // Initial fetch
        fetchMetrics();

        // Auto-refresh every 2 seconds
        setInterval(fetchMetrics, 2000);
    </script>
</body>
</html>
